# Ramp experiment on the 3 lab machines. The nodes run on their own machines, so the runner
# prints how to start each one with this run's --run-id, waits for Enter, then runs the load.
# Fill in the IPs in config/nodes.lab.toml first.
#   cargo build --release
#   cargo run --release -p loadgen --bin experiment -- experiments/ramp-lab.toml

name = "ramp-lab"
cluster = "config/nodes.lab.toml"  # the 3 machines' real addresses
start_nodes = false                # the nodes are started by hand on each machine
seed = 1
stages = [1, 2, 4, 8, 16]          # clients per stage
stage_secs = 30                    # 2.5 minutes in total
# Multicast to all 3 nodes (no `target`). Check the retry timing on the lab network:
attempts = 3
attempt_timeout_ms = 2000

# TEMPORARY until P4's DFS: the 3 nodes share ONE set of resources through a folder all 3 machines
# reach, e.g. a Windows shared folder. Replace the path; empty the folder before each run.
# Or set `shared_state = false` to give each node its own private copy (the old behaviour).
shared_state_dir = '\\REPLACE-ME\rescuemesh-state'
