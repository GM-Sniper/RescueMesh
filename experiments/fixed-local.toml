# Fixed run on one laptop: 10 clients, 1000 requests at 100 per second, multicast to all 3 nodes.
#   cargo run --release -p loadgen --bin experiment -- experiments/fixed-local.toml

name = "fixed-local"
cluster = "config/nodes.toml"
start_nodes = true
seed = 1
clients = 10        # fixed mode: no `stages`
requests = 1000
rate = 100          # requests per second across all clients; leave out for "as fast as possible"
