// RescueMesh wire protocol (owner: P1).
// v0 (Fri Oct 16): Heartbeat only, to prove the build and gRPC work.
// v1 (Mon Oct 19): adds Submit, domain types, Bid, Replicate, FetchLog, FaultCommand.
// v2 (Mon Oct 26): election calls ExchangeBid and AnnounceWinner; Bid gets round and ready (P3, agreed with P1 in Q1).
// Rule: every state-changing message carries request_id.
// Rule: never change or reuse a field number once it is merged.
syntax = "proto3";

package rescuemesh.v1;

// RPCs offered by every cloud node. Peers and clients both call it.
service Node {
  // Liveness probe, sent by each node to each peer every 500 ms.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);

  // Client entry point: report an incident, get back a response plan.
  rpc Submit(SubmitRequest) returns (SubmitReply);

  // The call the fault-injector CLI makes: send a FaultCommand to the node, get a FaultAck back.
  rpc InjectFault(FaultCommand) returns (FaultAck);

  // Election, node to node: send my bid, get the peer's bid back in the reply.
  rpc ExchangeBid(BidRequest) returns (Bid);

  // Election, node to node: the winner tells the others it is handling the request.
  rpc AnnounceWinner(Coordinator) returns (CoordinatorAck);
}

message HeartbeatRequest {
  uint32 from_node = 1;  // sender's node ID; 0 means a client (node IDs start at 1)
  uint64 seq = 2;        // sender's counter, +1 per heartbeat
}

message HeartbeatReply {
  uint32 node_id = 1;    // replier's ID, so the caller knows it reached the right node
  uint64 seq = 2;        // echoes the request's seq
}

// ---- Client requests (owner: P1) ----

message SubmitRequest {
  string request_id = 1;    // client-generated Uuid; same ID on every retry
  oneof kind {              // what the client is submitting
    Incident incident = 2;  // Step A: the only kind
    // Later kinds get NEW numbers, e.g. ResourceOffer offer = 3; ResourceRequest need = 4;
  }
}

message SubmitReply {
  string request_id = 1;     // echoes the request's ID, since replies can come from several nodes
  uint32 executor_node = 2;  // node that ran the planner
  Plan plan = 3;
  bool duplicate = 4;        // true if this request_id was already processed and the stored plan was returned
}

// ---- Domain types (fields from P2's common::domain; schema owned by P1) ----
// Every enum starts with UNSPECIFIED = 0, so a field the sender forgot is rejected
// instead of silently meaning the first real value.

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_MEDICAL = 1;
  CATEGORY_FIRE = 2;
  CATEGORY_RESCUE = 3;
  CATEGORY_SUPPLY = 4;
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_AMBULANCE = 1;
  RESOURCE_TYPE_FIRE_TRUCK = 2;
  RESOURCE_TYPE_RESCUE_TEAM = 3;
  RESOURCE_TYPE_SUPPLY_TRUCK = 4;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_OPEN = 1;
  INCIDENT_STATUS_ASSIGNED = 2;
  INCIDENT_STATUS_RESOLVED = 3;
}

message Zone {             // one cell of the 5x5 grid
  uint32 x = 1;            // 0..4
  uint32 y = 2;            // 0..4
}

message Incident {
  uint64 id = 1;
  uint32 owner = 2;
  Category category = 3;
  Zone location = 4;
  uint32 severity = 5;      // 1..10
  uint64 timestamp_ms = 6;  // unix ms, set by the reporter
  IncidentStatus status = 7;
  uint64 ttl_secs = 8;
}

message Resource {
  uint64 id = 1;
  ResourceType resource_type = 2;
  uint32 quantity = 3;
  bool available = 4;
  Zone location = 5;
  uint64 lease_expiry_ms = 6;  // unix ms; 0 = not leased
}

message Assignment {
  uint64 incident_id = 1;
  uint64 resource_id = 2;
  double score = 3;
}

message Plan {
  uint64 incident_id = 1;
  double priority = 2;
  repeated Assignment assignments = 3;  // v1: at most one
}

// Failure simulation command.
message FaultCommand {
  string fault_id = 1;     // unique ID for this fail order
  uint32 target_node = 2;  // which node must fail
  uint64 duration_ms = 3;  // how long to stay unavailable; the node wakes itself when this expires
  uint32 issuer_node = 4;  // who sent the fail order
  uint64 term = 5;         // to be used later
}

// Reply to the fault injector ONLY.
// Never sent to the other nodes: they must discover the failure on their own.
message FaultAck {
  string fault_id = 1;     // copies the order's ID, so the injector knows which fail order this reply is for
  bool accepted = 2;       // true = the node will go silent now; false = the order was refused
  string reason = 3;       // why it was refused (e.g. "duration over 20 s"); empty if accepted
}

// ---- Election (owner: P3) ----
// Step B: for each request, every alive node sends its Bid; the lowest load_score
// runs the planner. Ties go to the lowest node_id, so every node picks the same winner.

message Bid {
  string request_id = 1;  // the request being bid on; bids for different requests never mix
  uint32 node_id = 2;     // bidder's ID (starts at 1)
  double load_score = 3;  // bidder's LoadReport score, normalized 0-1; lower = less loaded
  uint32 round = 4;       // election number for this request: 0, then +1 for each re-election after a failed winner
  bool ready = 5;         // false = bidder cannot reach the shared state; counts as an answer but cannot win
}

// ExchangeBid's call. Carries the client's request too, so a peer whose copy from
// the client is late or lost can still bid, and run the planner if it wins.
message BidRequest {
  Bid bid = 1;
  SubmitRequest request = 2;
}

// AnnounceWinner's call: "I won this round of this request and I'm handling it".
message Coordinator {
  string request_id = 1;
  uint32 round = 2;
  uint32 node_id = 3;     // the winner
}

message CoordinatorAck {
  uint32 node_id = 1;     // replier's ID, like HeartbeatReply
}

// ---- Change log and replication (owner: P4) ----
// Field numbers are wire identities: rename freely, never renumber or reuse once merged.

message LogEntry {
  uint32 source_node = 1;   // node that executed the request and created this entry
  uint64 seq = 2;           // entry number, counted per source node: 1, 2, 3...
                            // assigned by the source node inside the store's write lock
  string request_id = 3;    // client Uuid, used to spot client retries
  uint64 timestamp_ms = 4;  // source node's wall clock; informational only, never for ordering
  oneof op {
    ApplyPlan apply_plan = 5;
    // Future change types (Steps B/C). Add with NEW numbers, never reuse:
    //   ClaimLease     claim_lease     = 6;
    //   UpdatePresence update_presence = 7;
  }
}

// Step A's only op: "this incident arrived, this plan was decided".
message ApplyPlan {
  Incident incident = 1;
  Plan plan = 2;
}

// Step B: source node pushes a new entry to a peer.
message ReplicateRequest {
  LogEntry entry = 1;
}

message ReplicateReply {
  uint32 replying_node = 1;  // who is answering
  uint32 source_node = 2;    // whose log this ack is about
  uint64 acked_seq = 3;      // highest seq from that source the replier has applied
}

// Step C: a returning node pulls what it missed.
message FetchLogRequest {
  uint32 requesting_node = 1;
  map<uint32, uint64> last_seq_by_source = 2;  // source node -> last seq I already have (= my `applied` map)
}

message FetchLogReply {
  repeated LogEntry entries = 1;
}
