# Localhost layout: 3 nodes on one laptop, different ports.
# For the 3 real machines, copy this to nodes.lab.toml and put in their IPs (same port is fine).
# Every program reads this file: nodes find themselves by --id, clients read the addresses.

[[nodes]]
id = 1
addr = "127.0.0.1:50051"

[[nodes]]
id = 2
addr = "127.0.0.1:50052"

[[nodes]]
id = 3
addr = "127.0.0.1:50053"

# Optional: any missing value falls back to the default shown.
[timing]
heartbeat_interval_ms = 500   # each node -> each peer
suspect_after_ms = 1500       # 3 missed heartbeats -> peer suspected down
rpc_deadline_ms = 1000        # longest wait for a peer's reply
connect_timeout_ms = 500      # longest wait to open a connection

# Planner scoring weights (P2). Optional; defaults are the worked example's.
[weights]
severity = 0.6
age = 0.4
capability = 0.7
distance = 0.3

# Load score for Step B's election (P3). Optional; defaults shown.
# load_score = 0.5 x queue + 0.3 x CPU + 0.2 x service time, each normalized to 0-1.
[load]
sample_interval_ms = 200   # CPU sampling; sysinfo needs >= 200 ms between readings
queue_weight = 0.5
cpu_weight = 0.3
service_weight = 0.2
queue_max = 10             # this many requests in progress = fully loaded
service_cap_ms = 100.0     # this average time per request = fully loaded
service_ewma_alpha = 0.2   # newest request's share of the service-time average
# Planner workload settings (P2). Optional; defaults shown.
[planner]
workload_incidents = 10
workload_resources = 20
iterations = 1


# Automatic fault injection (P5, Step B). Optional; off unless enabled = true.
# Use the same values on all 3 nodes. Design: docs/p5-auto-injector-design.md
[faults]
enabled = false        # true = nodes silence one of themselves on a random schedule
seed = 42              # same seed = same victims, durations and gaps
min_duration_ms = 2000 # shortest silence (faults under ~1.5 s are never detected)
max_duration_ms = 20000 # longest silence; the spec allows up to 20 s
min_gap_ms = 10000     # wait between faults, counted from when all nodes are alive again
max_gap_ms = 30000
