[package]
name = "node"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tonic.workspace = true
tokio = { workspace = true, features = ["sync"] }  # sync: the semaphore that caps parallel calls to the S3 gateway
clap.workspace = true
anyhow.workspace = true
sysinfo.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
futures-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }  # RUST_LOG=debug shows more

[dev-dependencies]
# Tests only: a paused, fake clock, so a 10 s mute test runs in milliseconds.
tokio = { workspace = true, features = ["test-util"] }
