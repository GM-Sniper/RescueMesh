[package]
name = "node"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tonic.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
sysinfo.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }  # RUST_LOG=debug shows more
serde.workspace = true  # P6, TEMPORARY until the DFS: file_store.rs reads and writes the shared-state files
toml.workspace = true   # P6, TEMPORARY until the DFS: the shared-state files are TOML

[dev-dependencies]
# Tests only: a paused, fake clock, so a 10 s mute test runs in milliseconds.
tokio = { workspace = true, features = ["test-util"] }
