[package]
name = "loadgen"
version = "0.1.0"
edition = "2024"
default-run = "loadgen"          # `cargo run -p loadgen` runs the load generator; the stats script is `--bin stats`

[dependencies]
client = { path = "../client" }  # ClientMiddleware: sends one request and times it (P6, Sun)
common = { path = "../common" }  # P2's generate_incident and incident_to_pb
tokio = { workspace = true, features = ["signal", "sync"] }  # many fake clients at once, the rate timer; signal + sync: a clean stop that still resolves every assigned incident
clap.workspace = true            # reads --clients --requests --seed --rate from the command line
anyhow.workspace = true          # simple error handling in main
serde.workspace = true           # experiment runner: reads the experiment config file into a struct
toml.workspace = true            # experiment runner: the config file is TOML, like config/nodes.toml
